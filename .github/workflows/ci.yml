name: CI

on:
  pull_request:
  push:
    branches: [main, development]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DEVPUSH_BASE_URL: http://localhost:7429
      DEVPUSH_SECRET_ENCRYPTION_KEY: ci-secret-encryption-key
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm release:check
      - run: pnpm lint
      - run: pnpm docs:check
      - run: pnpm test
        env:
          DEVPUSH_RUN_DOCKER_TESTS: '1'
      - run: pnpm build
      - run: pnpm smoke:node
      - run: pnpm smoke:dev
      - run: pnpm --dir app db:migrate
      - run: pnpm test:integration
      - run: pnpm --dir app test:integration:libsql
      - run: pnpm agent:test
      - run: go vet ./agent/...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: agent
      - run: pnpm audit:dependencies

  production-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: bash scripts/validate-production-image.sh

  package-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:package

  worker:
    runs-on: ubuntu-latest
    services:
      libsql-main:
        image: ghcr.io/tursodatabase/libsql-server@sha256:6dd3eb276d9d3604e4a48ac4a999a2e267814732d57d7e94c04ba71482333a67
        ports:
          - 7561:8080
      libsql-logs:
        image: ghcr.io/tursodatabase/libsql-server@sha256:6dd3eb276d9d3604e4a48ac4a999a2e267814732d57d7e94c04ba71482333a67
        ports:
          - 7562:8080
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir app smoke:worker d1
      - run: pnpm --dir app smoke:worker libsql
