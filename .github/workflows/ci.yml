name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DEVPUSH_BASE_URL: http://localhost:7429
      DEVPUSH_SECRET_ENCRYPTION_KEY: ci-secret-encryption-key
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --dir app db:migrate
      - run: pnpm test:integration
      - run: pnpm --dir app test:integration:libsql
      - run: pnpm agent:test
      - run: go vet ./agent/...
      - run: pnpm audit:dependencies

  worker:
    runs-on: ubuntu-latest
    services:
      libsql-main:
        image: ghcr.io/tursodatabase/libsql-server@sha256:6dd3eb276d9d3604e4a48ac4a999a2e267814732d57d7e94c04ba71482333a67
        ports:
          - 7561:8080
      libsql-logs:
        image: ghcr.io/tursodatabase/libsql-server@sha256:6dd3eb276d9d3604e4a48ac4a999a2e267814732d57d7e94c04ba71482333a67
        ports:
          - 7562:8080
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir app smoke:worker d1
      - run: pnpm --dir app smoke:worker libsql
