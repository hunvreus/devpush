name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: devpush
          POSTGRES_PASSWORD: devpush
          POSTGRES_USER: devpush
        ports:
          - 7543:5432
        options: >-
          --health-cmd "pg_isready -U devpush -d devpush"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://devpush:devpush@localhost:7543/devpush
      DEVPUSH_BASE_URL: http://localhost:7429
      DEVPUSH_SECRET_ENCRYPTION_KEY: ci-secret-encryption-key
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --dir app build:cloudflare
      - run: pnpm --dir app db:migrate
      - run: pnpm test:integration
      - run: pnpm agent:test
      - run: go vet ./agent/...
      - run: pnpm audit:dependencies
