name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to publish to npm
        required: true
        type: string
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

jobs:
  release:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      DEVPUSH_BASE_URL: http://localhost:7429
      DEVPUSH_SECRET_ENCRYPTION_KEY: ci-release-secret-encryption-key
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - id: toolchain
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_OUTPUT"
          import {readFileSync} from 'node:fs';
          import {validateAgentRelease} from './app/src/lib/agent-release.mjs';
          const manifest=validateAgentRelease(JSON.parse(readFileSync('app/agent-release.json','utf8')));
          console.log(`version=${manifest.goVersion.slice(2)}`);
          JS
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ steps.toolchain.outputs.version }}
          cache-dependency-path: agent/go.mod
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - run: pnpm agent:test
      - run: pnpm agent:release:prepare
      - run: git diff --exit-code -- app/agent-release.json
      - run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-user
          bin/devpush-agent-linux-amd64 version --json > bin/metadata-linux-amd64.json
          qemu-aarch64 bin/devpush-agent-linux-arm64 version --json > bin/metadata-linux-arm64.json
          node scripts/verify-agent-release.mjs --tag "$GITHUB_REF_NAME" --runtime
      - run: pnpm typecheck && pnpm lint && pnpm docs:check && pnpm build
      - run: pnpm smoke:node
      - run: pnpm test && pnpm test:integration && pnpm test:package
      - run: pnpm validate:production
      - run: mkdir -p release && pnpm --dir app pack --pack-destination ../release
      - name: Publish the verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" \
            bin/devpush-agent-linux-amd64 bin/devpush-agent-linux-arm64 \
            bin/agent-release.json bin/SHA256SUMS release/devpush-*.tgz \
            --verify-tag --generate-notes "${release_flags[@]}"
      - name: Verify public agent downloads
        run: |
          download_dir="$(mktemp -d)"
          trap 'rm -rf "$download_dir"' EXIT
          release_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          for asset in devpush-agent-linux-amd64 devpush-agent-linux-arm64 agent-release.json SHA256SUMS; do
            curl --fail --location --retry 5 --retry-all-errors --output "$download_dir/$asset" "$release_url/$asset"
          done
          cmp bin/agent-release.json "$download_dir/agent-release.json"
          cmp bin/SHA256SUMS "$download_dir/SHA256SUMS"
          (cd "$download_dir" && sha256sum --check SHA256SUMS)

  npm:
    if: always() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    needs: release
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate release tag
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Download the verified application package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'devpush-*.tgz' --dir release
      - name: Publish to npm using trusted publishing
        run: |
          tag=latest
          if [[ "$RELEASE_TAG" == *-* ]]; then tag=beta; fi
          npm publish ./release/devpush-*.tgz --access public --provenance --tag "$tag"
