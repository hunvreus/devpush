name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to retry npm publication and hosted deployment
        required: true
        type: string
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Reuse CI for this exact commit and plan agent publication
        id: ci
        run: node scripts/release-ci.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download the package tested by CI
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ steps.ci.outputs.ci_run_id }}
        run: gh run download "$CI_RUN_ID" --name tested-package --dir release
      - id: version
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_OUTPUT"
          import {readFileSync} from 'node:fs';
          const pkg=JSON.parse(readFileSync('app/package.json'));
          const pin=JSON.parse(readFileSync('app/agent-release.json'));
          console.log(`version=${pkg.version}`);
          console.log(`go=${pin.goVersion.slice(2)}`);
          JS
      - if: steps.ci.outputs.build_agent == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ steps.version.outputs.go }}
          cache-dependency-path: agent/go.mod
      - name: Build changed agent binaries and verify the committed pin
        if: steps.ci.outputs.build_agent == 'true'
        run: |
          node scripts/agent-release.mjs
          git diff --exit-code -- app/agent-release.json
          sudo apt-get update
          sudo apt-get install --yes qemu-user
          bin/devpush-agent-linux-amd64 version --json > bin/metadata-linux-amd64.json
          qemu-aarch64 bin/devpush-agent-linux-arm64 version --json > bin/metadata-linux-arm64.json
          node scripts/verify-agent-release.mjs --tag "$GITHUB_REF_NAME" --runtime
      - name: Verify the existing agent release when its source is unchanged
        if: steps.ci.outputs.build_agent != 'true'
        run: node scripts/download-agent-release.mjs
      - name: Publish the verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_AGENT: ${{ steps.ci.outputs.build_agent }}
        run: |
          release_flags=()
          assets=(release/devpush-*.tgz)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then release_flags+=(--prerelease --latest=false); fi
          if [[ "$BUILD_AGENT" == true ]]; then
            assets+=(bin/devpush-agent-linux-amd64 bin/devpush-agent-linux-arm64 bin/agent-release.json bin/SHA256SUMS)
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --generate-notes "${release_flags[@]}"
      - name: Verify newly published agent downloads
        if: steps.ci.outputs.build_agent == 'true'
        run: node scripts/download-agent-release.mjs

  npm:
    if: always() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    needs: release
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate release tag
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Download the verified application package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'devpush-*.tgz' --dir release
      - name: Publish and wait until npm serves the verified package
        run: node scripts/publish-package.mjs
      - name: Start hosted checks and deployment
        env:
          HOSTED_DEPLOY_TOKEN: ${{ secrets.HOSTED_DEPLOY_TOKEN }}
        run: node scripts/notify-hosted.mjs
